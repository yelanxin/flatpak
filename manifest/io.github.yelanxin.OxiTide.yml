app-id: io.github.yelanxin.OxiTide
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: oxitide
separate-locales: false

# OxiTide is proprietary freeware. The binary is not built here: the
# native Ubuntu 24.04 .deb published on the release hub is downloaded
# at install time (extra-data) and unpacked into /app/extra.
#
# Output drivers are ALSA direct / ALSA mmap (bit-perfect hw:CARD,DEV
# access — there is no PulseAudio/PipeWire backend) and USB Rawlink
# (direct USB passthrough to the DAC via libusb). Both need device
# nodes — /dev/snd and /dev/bus/usb — hence `--device=all` (Flatpak has
# no narrower device class for sound cards).
#
# USB Rawlink additionally needs the seat user to be allowed to open the
# DAC's USB node. The native packages install a udev `uaccess` rule for
# that; the Flatpak can't, so on the first EACCES the app shows the
# one-line command to install the same rule on the host (with a copy
# button) and retries once the user has done so.

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Audio output: ALSA direct / mmap (/dev/snd) and USB Rawlink
  # (/dev/bus/usb). The app has no PulseAudio/PipeWire backend, so a
  # socket is not enough.
  - --device=all
  # The shared PipeWire driver (the default): PipeWire's own socket, for
  # the `pipewire` ALSA PCM the driver opens and for `pw-dump`, which
  # lists the sinks in the device picker. Without it the driver cannot
  # open its output at all inside the sandbox.
  - --filesystem=xdg-run/pipewire-0
  # TIDAL streaming + sign-in
  - --share=network
  # Local music folders: the Music folder and external drives directly;
  # any other folder the user adds comes through the file chooser portal
  # (a document-portal path that persists across runs). Read-write:
  # Browse Files edits tags / CUE sheets and moves files to the Trash.
  - --filesystem=xdg-music
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  # MPRIS / media keys
  - --own-name=org.mpris.MediaPlayer2.oxitide
  # One-click USB authorization: run `pkexec` on the host via
  # `flatpak-spawn --host` to install the udev uaccess rule (polkit
  # password prompt). Without this the app falls back to showing the
  # manual command. Not acceptable on Flathub (sandbox escape) — this
  # manifest targets the self-hosted repo.
  - --talk-name=org.freedesktop.Flatpak
  # ALSA direct output takes the sound card exclusively through the
  # freedesktop ReserveDevice1 protocol: own the per-card name
  # (org.freedesktop.ReserveDevice1.Audio<card index>) and ask the
  # current holder (PipeWire / PulseAudio) to release the card.
  # Linter exception: finish-args-own-name-wildcard-org.freedesktop.ReserveDevice1
  # (OWN includes TALK; listing both would downgrade the policy to the
  # last entry.)
  - --own-name=org.freedesktop.ReserveDevice1.*
  # BT Rawlink: the player as the A2DP source. It registers media
  # endpoints with BlueZ on the system bus and takes the transport socket
  # from it. Keeping WirePlumber off Bluetooth meanwhile (a drop-in in the
  # user's WirePlumber configuration and a restart of the user service)
  # goes through `flatpak-spawn --host`, on the org.freedesktop.Flatpak
  # permission above.
  - --system-talk-name=org.bluez
  # System tray (StatusNotifier)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Inhibit suspend while playing
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager

modules:
  # Bluetooth encoders for BT Rawlink. The player loads them at run time
  # from /app/lib and offers only the codecs it finds; the GNOME runtime
  # carries none of these (it does have libopus).
  - name: sbc
    buildsystem: autotools
    config-opts: [--disable-tester, --disable-tools, --disable-static]
    cleanup: [/include, /lib/pkgconfig, '*.la']
    sources:
      - type: archive
        url: https://www.kernel.org/pub/linux/bluetooth/sbc-2.1.tar.xz
        sha256: 426633cabd7c798236443516dfa8335b47e004b0ef37ff107e0c7ead3299fcc2
  - name: ldacBT
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DINSTALL_LIBDIR=/app/lib, -DCMAKE_POLICY_VERSION_MINIMUM=3.5]
    cleanup: [/include, /lib/pkgconfig]
    sources:
      - type: archive
        url: https://github.com/EHfive/ldacBT/releases/download/v2.0.2.3/ldacBT-2.0.2.3.tar.gz
        sha256: 4bd8eece78bb5c1361fab95743e7100506e2408a25c4a592a0f8d349746dc5b4
  - name: libfreeaptx
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} CC="gcc -std=c99" PREFIX=/app LIBDIR=lib
      - make CC="gcc -std=c99" PREFIX=/app LIBDIR=lib install
    cleanup: [/include, /lib/pkgconfig, /bin, '*.a']
    sources:
      - type: archive
        url: https://github.com/regularhunter/libfreeaptx/archive/refs/tags/0.2.2.tar.gz
        sha256: 5ab5ebddf3f2eb7ce47a505b87460b00fc1ede99c70010796d3575ab31ea80bf
  - name: fdk-aac
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_SHARED_LIBS=ON, -DBUILD_PROGRAMS=OFF]
    cleanup: [/include, /lib/pkgconfig, /lib/cmake]
    sources:
      - type: archive
        url: https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v2.0.3.tar.gz
        sha256: e25671cd96b10bad896aa42ab91a695a9e573395262baed4e4a2ff178d6a3a78
  - name: oxitide
    buildsystem: simple
    build-commands:
      - install -Dm755 oxitide.sh /app/bin/oxitide
      - install -Dm755 apply_extra.sh /app/bin/apply_extra
      - install -Dm644 io.github.yelanxin.OxiTide.desktop /app/share/applications/io.github.yelanxin.OxiTide.desktop
      - install -Dm644 io.github.yelanxin.OxiTide.metainfo.xml /app/share/metainfo/io.github.yelanxin.OxiTide.metainfo.xml
      - install -Dm644 io.github.yelanxin.OxiTide.svg /app/share/icons/hicolor/scalable/apps/io.github.yelanxin.OxiTide.svg
      - install -Dm644 io.github.yelanxin.OxiTide.png /app/share/icons/hicolor/128x128/apps/io.github.yelanxin.OxiTide.png
      # Bundled pixel font + licenses live in the extra-data tree; link
      # them where fontconfig / the metadata expect them (resolved after
      # apply_extra has run).
      - mkdir -p /app/share/fonts /app/share/licenses
      - ln -s /app/extra/usr/share/fonts/truetype/oxitide /app/share/fonts/oxitide
      - ln -s /app/extra/usr/share/licenses/oxitide /app/share/licenses/oxitide
    sources:
      - type: file
        path: oxitide.sh
      - type: file
        path: apply_extra.sh
      - type: file
        path: io.github.yelanxin.OxiTide.desktop
      - type: file
        path: io.github.yelanxin.OxiTide.metainfo.xml
      - type: file
        path: io.github.yelanxin.OxiTide.svg
      - type: file
        path: io.github.yelanxin.OxiTide.png
      # Bump url / sha256 / size on every release (see README.md).
      - type: extra-data
        filename: oxitide.deb
        only-arches: [x86_64]
        url: https://github.com/yelanxin/OxiTide/releases/download/v0.2.4.1/oxitide_0.2.4.1_amd64_ubuntu2404.deb
        sha256: 141d3c7877267fd8100593775131a3e4f89a60e86f4bf7873da2edc3832a60ac
        size: 14292650
        # flatpak-external-data-checker: follow the latest GitHub release
        # and rewrite url / sha256 / size (+ metainfo release entry).
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yelanxin/OxiTide/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("_amd64_ubuntu2404\\.deb$")) | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
